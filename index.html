<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحليل التكتيكي</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 10px 20px; border-bottom: 2px solid #333; }
        .navbar h3 { margin: 0; font-weight: 600; color: #66bb6a; font-size: 18px; }
        .logo { height: 40px; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .squad-section { background-color: #1e1e1e; border-radius: 10px; padding: 20px; }
        .section-title { color: #a0a0a0; font-size: 16px; margin: 15px 0 15px 0; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold;}
        .players-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        
        .player-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; padding: 10px; border-radius: 8px; width: 90px;}
        .player-card:hover { background-color: #2c2c2c; transform: scale(1.05); }
        .player-card img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #444; object-fit: cover; }
        .player-card span { color: #ccc; font-size: 13px; margin-top: 10px; font-weight: bold; text-align: center;}
        
        /* ------------------------------------- */
        /* تعديلات النافذة لتكون ثابتة في المنتصف */
        /* ------------------------------------- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: absolute; /* التعديل هنا لتثبيت الشاشة */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* التوسيط الدقيق */
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 20px;
            color: #ff4c4c;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 1001;
        }
        .close-btn:hover { color: #fff; }
        .video-title { color: #66bb6a; font-size: 18px; margin-bottom: 15px; font-weight: bold; padding-right: 10px;}
        iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; background-color: #000; }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="assets/logo1.png" class="logo" alt="Logo" onerror="this.style.display='none'">
        <h3>منصة التحليل التكتيكي</h3>
        <img src="assets/logo2.png" class="logo" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="container">
        <!-- قسم التشكيل -->
        <div class="squad-section" id="squadContainer"></div>
    </div>

    <!-- النافذة المنبثقة للفيديو -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="video-title" id="playingTitle">▶ يعرض الآن</div>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const playersData = {
            "حراس المرمى": [
                { name: "محمد سيحا", image: "images/goalkeepers/Seha.png", videoLink: "https://www.youtube.com/embed/mOkq1lN_x1w?autoplay=1" },
                { name: "محمد حمدي", image: "images/goalkeepers/Hamdy.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "عصام ثروت", image: "images/goalkeepers/Essam.png", videoLink: "رابط_الفيديو_هنا" }
            ],
            "المدافعين": [
                { name: "باهر المحمدي", image: "images/defenders/Baher.png", videoLink: "https://www.youtube.com/embed/eNinY8BgEgU?autoplay=1" },
                { name: "مصطفي العش", image: "images/defenders/El Aash.png", videoLink: "https://drive.google.com/file/d/1-3rN-ch8dPDpyNralflITGWudiy1YUIV/preview" },
                { name: "عمرو السعداوي", image: "images/defenders/El Saadawy.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "كريم العراقي", image: "images/defenders/EL Eraki.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمد هشام", image: "images/defenders/Hashem.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمد شكري", image: "images/defenders/Shokry.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "خالد صبحي", image: "images/defenders/Khaled Sobhi.png", videoLink: "رابط_الفيديو_هنا" },
                
                
            ],
            "خط الوسط": [
                { name: "عبد الرحيم دغموم", image: "images/midfielders/Deghmoum.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "يوسف الجوهري", image: "images/midfielders/El Gohary.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "ياسين الملاح", image: "images/midfielders/El Mallah.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "حسن علي", image: "images/midfielders/Hassan Ali.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "حسين فيصل", image: "images/midfielders/Hussein Faisal.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمود حمادة", image: "images/midfielders/Mahmoud Hamada.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمد مخلوف", image: "images/midfielders/Mohamed Makhlouf.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "أحمد القرموطي", image: "images/midfielders/Karmoty.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "خير الدين طوال", image: "images/midfielders/Kheir Toual.png", videoLink: "رابط_الفيديو_هنا" },
                
            ],
            "المهاجمين": [
                { name: "صلاح محسن", image: "images/forwards/Salah Mohsen.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "كريم بامبو", image: "images/forwards/Karim Bambo.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "علي سليمان", image: "images/forwards/Ali Sulieman.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "فخر الدين", image: "images/forwards/fakhr.jpg", videoLink: "رابط_الفيديو_هنا" },
            ]
        };

        const container = document.getElementById('squadContainer');

        for (const [position, players] of Object.entries(playersData)) {
            let sectionHTML = `<div class="section-title">${position}</div><div class="players-grid">`;
            
            players.forEach(player => {
                sectionHTML += `
                    <div class="player-card" onclick="openVideo('${player.name}', '${player.videoLink}')">
                        <img src="${player.image}" onerror="this.src='https://via.placeholder.com/65/222/FFF?text=N/A'">
                        <span>${player.name}</span>
                    </div>
                `;
            });
            
            sectionHTML += `</div>`;
            container.innerHTML += sectionHTML;
        }

        function openVideo(playerName, link) {
            const player = document.getElementById('videoPlayer');
            const modal = document.getElementById('videoModal');
            
            player.src = link; 
            document.getElementById('playingTitle').innerText = `▶ يعرض الآن: ${playerName}`;
            
            modal.style.display = "block"; 
            
            // تجميد حركة الخلفية (الأساس لحل المشكلة)
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            const modal = document.getElementById('videoModal');
            
            modal.style.display = "none"; 
            player.src = ""; 
            
            // إرجاع حركة الخلفية بعد قفل الفيديو
            document.body.style.overflow = "auto";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
