<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحليل التكتيكي</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 10px 20px; border-bottom: 2px solid #333; }
        .navbar h3 { margin: 0; font-weight: 600; color: #66bb6a; }
        .logo { height: 50px; }
        
        .container { display: flex; padding: 20px; gap: 20px; height: calc(100vh - 100px); flex-wrap: wrap; }
        
        .video-section { flex: 2; min-width: 300px; display: flex; flex-direction: column; background-color: #1e1e1e; border-radius: 10px; padding: 15px; }
        .video-title { color: #66bb6a; font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        iframe { width: 100%; height: 100%; min-height: 400px; border: none; border-radius: 8px; background-color: #000; }
        
        .squad-section { flex: 1; min-width: 250px; background-color: #1e1e1e; border-radius: 10px; padding: 15px; overflow-y: auto; }
        .section-title { color: #a0a0a0; font-size: 14px; margin: 15px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .players-grid { display: flex; flex-wrap: wrap; gap: 15px; }
        
        .player-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; padding: 5px; border-radius: 8px; width: 80px;}
        .player-card:hover { background-color: #2c2c2c; }
        .player-card img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #444; object-fit: cover; }
        .player-card span { color: #ccc; font-size: 12px; margin-top: 8px; font-weight: bold; text-align: center;}
        .active-player { background-color: #333; }
        .active-player img { border-color: #66bb6a; border-width: 3px; }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="assets/logo1.png" class="logo" alt="Logo" onerror="this.style.display='none'">
        <h3>منصة التحليل التكتيكي</h3>
        <img src="assets/logo2.png" class="logo" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="container">
        <!-- الكود هنا فاضي، الجافاسكريبت هيملطش الداتا ويرصها لوحده -->
        <div class="squad-section" id="squadContainer"></div>

        <div class="video-section">
            <div class="video-title" id="playingTitle">▶ اختر لاعب لعرض الحالات التكتيكية</div>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ==========================================
        // تعديل: أضفنا videoLink بدلاً من videoId عشان يقبل الرابط كامل
        // ==========================================
        const playersData = {
            "حراس المرمى": [
                { name: "محمد سيحا", image: "images/goalkeepers/Seha.png", videoLink: "https://www.youtube.com/embed/mOkq1lN_x1w?autoplay=1" },
                { name: "محمد حمدي", image: "images/goalkeepers/Hamdy.png", videoLink: "رابط_الفيديو_هنا" }
            ],
            "المدافعين": [
                { name: "باهر المحمدي", image: "images/defenders/Baher.png", videoLink: "https://www.youtube.com/embed/eNinY8BgEgU?autoplay=1" },
                { name: "مصطفي العش", image: "images/defenders/El Aash.png", videoLink: "https://drive.google.com/file/d/1-3rN-ch8dPDpyNralflITGWudiy1YUIV/preview" },
                { name: "السعدوي", image: "images/defenders/El Saadawy.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "كريم العراقي", image: "images/defenders/EL Eraki.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمد هشام", image: "images/defenders/Hashem.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "محمد شكري", image: "images/defenders/Shokry.png", videoLink: "رابط_الفيديو_هنا" },
                { name: "خالد صبحي", image: "images/defenders/baher.jpg", videoLink: "رابط_الفيديو_هنا" },
                
            ],

            "خط الوسط": [
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "ميدو جابر", image: "images/midfielders/mido.jpg", videoLink: "رابط_الفيديو_هنا" },
            ],
            "المهاجمين": [
                { name: "صلاح محسن", image: "images/forwards/salah.jpg", videoLink: "رابط_الفيديو_هنا" },
                { name: "فخر الدين", image: "images/forwards/fakhr.jpg", videoLink: "رابط_الفيديو_هنا" }
            ]
        };

        // ==========================================
        // الكود ده هو اللي بيبني الشاشة (ماتلعبش فيه)
        // ==========================================
        const container = document.getElementById('squadContainer');

        for (const [position, players] of Object.entries(playersData)) {
            let sectionHTML = `<div class="section-title">${position}</div><div class="players-grid">`;
            
            players.forEach(player => {
                sectionHTML += `
                    <div class="player-card" onclick="changeVideo('${player.name}', '${player.videoLink}', this)">
                        <img src="${player.image}" onerror="this.src='https://via.placeholder.com/65/222/FFF?text=N/A'">
                        <span>${player.name}</span>
                    </div>
                `;
            });
            
            sectionHTML += `</div>`;
            container.innerHTML += sectionHTML;
        }

        // ==========================================
        // تعديل: الدالة بقت بتاخد الرابط كامل وتحطه مباشرة
        // ==========================================
        function changeVideo(playerName, link, element) {
            const player = document.getElementById('videoPlayer');
            player.src = link;
            
            document.getElementById('playingTitle').innerText = `▶ يعرض الآن: ${playerName}`;
            
            document.querySelectorAll('.player-card').forEach(card => card.classList.remove('active-player'));
            element.classList.add('active-player');
        }
    </script>
</body>
</html>
